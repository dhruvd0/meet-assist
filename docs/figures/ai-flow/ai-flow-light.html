    <title>How CASE listens</title>
    <style>
      .iso {
        --anatomy-page: #0b0b0b;
        --anatomy-card: #131313;
        --anatomy-text: #a3a3a3;
        --anatomy-strong: #e6e6e6;
        --anatomy-muted: #6e6e6e;
        --anatomy-paper: #131313;
        --anatomy-face: #1b1b1b;
        --anatomy-top: #1c1c1c;
        --anatomy-shade-0: #0f0f0f;
        --anatomy-shade-1: #121212;
        --anatomy-shade-2: #151515;
        --anatomy-shade-3: #181818;
        --anatomy-lit-top: #262626;
        --anatomy-lit-shade: #1d1d1d;
        --anatomy-hi: #d4d4d4;
        --anatomy-mid: #6a6a6a;
        --anatomy-lo: #3e3e3e;
        --anatomy-faint: #2a2a2a;
        --anatomy-lit: #ffffff;
        --anatomy-halo: #050505;
        --anatomy-halo-opacity: 0.9;
        --anatomy-dot: #e6e6e6;
        --anatomy-red: #ff6b6b;
        --anatomy-green: #6be0a0;
        --anatomy-blue: #6b9bff;
        --anatomy-weight: 0.6px;
        --anatomy-ease: cubic-bezier(0.32, 0.72, 0, 1);
        --anatomy-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --anatomy-lift:
          inset 0 1px 0 0 #ffffff0a, inset 0 0 0 1px #ffffff06,
          0 0 0 1px #00000026, 0 1px 1px -0.5px #00000014,
          0 3px 3px -1.5px #00000014, 0 6px 6px -3px #00000014,
          0 12px 12px -6px #00000014;
      }
      .iso[data-theme="light"] {
        --anatomy-page: #f2f2ef;
        --anatomy-card: #fbfbfa;
        --anatomy-text: #57575a;
        --anatomy-strong: #18181a;
        --anatomy-muted: #8c8c90;
        --anatomy-paper: #fbfbfa;
        --anatomy-face: #ffffff;
        --anatomy-top: #ffffff;
        --anatomy-shade-0: #dcdcd9;
        --anatomy-shade-1: #e5e5e2;
        --anatomy-shade-2: #ededea;
        --anatomy-shade-3: #f4f4f1;
        --anatomy-lit-top: #ffffff;
        --anatomy-lit-shade: #eeeeeb;
        --anatomy-hi: #26262a;
        --anatomy-mid: #8a8a8f;
        --anatomy-lo: #b4b4b8;
        --anatomy-faint: #d4d4d6;
        --anatomy-lit: #000000;
        --anatomy-halo: #8a8a80;
        --anatomy-halo-opacity: 0.32;
        --anatomy-dot: #3a3a3e;
        --anatomy-red: #e5484d;
        --anatomy-green: #30a46c;
        --anatomy-blue: #3e63dd;
        --anatomy-lift:
          inset 0 1px 0 0 #ffffff, 0 0 0 1px #0000000f,
          0 1px 1px -0.5px #0000000a, 0 3px 3px -1.5px #0000000a,
          0 6px 6px -3px #0000000a, 0 12px 12px -6px #0000000a;
      }
      .iso-svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .iso-svg path,
      .iso-svg circle {
        vector-effect: non-scaling-stroke;
      }
      .iso-fill {
        fill: var(--anatomy-paper);
        stroke: none;
      }
      .iso-solid[data-lit] > .iso-fill {
        fill: var(--anatomy-face);
      }
      .iso-shade,
      .iso-top {
        stroke: none;
      }
      .iso-shade[data-shade="0"] {
        fill: var(--anatomy-shade-0);
      }
      .iso-shade[data-shade="1"] {
        fill: var(--anatomy-shade-1);
      }
      .iso-shade[data-shade="2"] {
        fill: var(--anatomy-shade-2);
      }
      .iso-shade[data-shade="3"] {
        fill: var(--anatomy-shade-3);
      }
      .iso-top {
        fill: var(--anatomy-top);
      }
      .iso-solid[data-lit] > .iso-top {
        fill: var(--anatomy-lit-top);
      }
      .iso-solid[data-lit] > .iso-shade {
        fill: var(--anatomy-lit-shade);
      }
      .iso-solid[data-seamless] > .iso-shade,
      .iso-solid[data-seamless] > .iso-top {
        stroke-width: 0.4;
        stroke-linejoin: round;
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="0"] {
        stroke: var(--anatomy-shade-0);
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="1"] {
        stroke: var(--anatomy-shade-1);
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="2"] {
        stroke: var(--anatomy-shade-2);
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="3"] {
        stroke: var(--anatomy-shade-3);
      }
      .iso-solid[data-seamless] > .iso-top {
        stroke: var(--anatomy-top);
      }
      .iso-solid[data-seamless][data-lit] > .iso-top {
        stroke: var(--anatomy-lit-top);
      }
      .iso-solid[data-seamless][data-lit] > .iso-shade {
        stroke: var(--anatomy-lit-shade);
      }
      .iso-solid[data-lit] > .iso-edge {
        stroke: var(--anatomy-lit);
      }
      .iso-halo {
        fill: var(--anatomy-halo);
        stroke: none;
        filter: blur(9px);
        opacity: var(--anatomy-halo-opacity);
        transform: translateY(3px);
      }
      .iso-line {
        fill: none;
        stroke: var(--anatomy-lo);
        stroke-width: var(--anatomy-weight);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .iso-line[data-tone="hi"] {
        stroke: var(--anatomy-hi);
      }
      .iso-line[data-tone="mid"] {
        stroke: var(--anatomy-mid);
      }
      .iso-line[data-tone="lo"] {
        stroke: var(--anatomy-lo);
      }
      .iso-line[data-tone="faint"] {
        stroke: var(--anatomy-faint);
      }
      .iso-line[data-tone="lit"] {
        stroke: var(--anatomy-lit);
      }
      .iso-line[data-tone="red"] {
        stroke: var(--anatomy-red);
      }
      .iso-line[data-tone="green"] {
        stroke: var(--anatomy-green);
      }
      .iso-line[data-tone="blue"] {
        stroke: var(--anatomy-blue);
      }
      .iso-line[data-dotted] {
        stroke-dasharray: 0.01 3.5;
        stroke-width: 1;
      }
      .iso-line[data-dashed] {
        stroke-dasharray: 3 3;
      }
      .iso-line[data-flow] {
        stroke-dasharray: 2 6;
      }
      .iso-wire-end {
        fill: var(--anatomy-paper);
        stroke: var(--anatomy-lo);
        stroke-width: var(--anatomy-weight);
      }
      .iso-wire[data-tone="hi"] .iso-wire-end {
        stroke: var(--anatomy-hi);
      }
      .iso-wire[data-tone="mid"] .iso-wire-end {
        stroke: var(--anatomy-mid);
      }
      .iso-wire[data-tone="faint"] .iso-wire-end {
        stroke: var(--anatomy-faint);
      }
      .iso-wire[data-tone="lit"] .iso-wire-end {
        stroke: var(--anatomy-lit);
      }
      .iso-dots circle {
        fill: var(--anatomy-dot);
        stroke: none;
        opacity: 0.32;
      }
      .iso-dots[data-tone="hi"] circle {
        opacity: 0.85;
      }
      .iso-dots[data-tone="mid"] circle {
        opacity: 0.45;
      }
      .iso-dots[data-tone="lo"] circle {
        opacity: 0.22;
      }
      .iso-dots[data-tone="faint"] circle {
        opacity: 0.12;
      }
      .iso-face-text {
        fill: var(--anatomy-mid);
        font-family: var(--anatomy-mono);
        letter-spacing: 0.04em;
      }
      .iso-face-text[data-tone="hi"] {
        fill: var(--anatomy-hi);
      }
      .iso-face-text[data-tone="lo"] {
        fill: var(--anatomy-lo);
      }
      .iso-face-text[data-tone="faint"] {
        fill: var(--anatomy-faint);
      }
      .tb-body {
        fill: var(--anatomy-shade-2);
        stroke: none;
      }
      .tb-shine {
        fill: var(--anatomy-top);
        stroke: none;
      }
      .tb-shade {
        fill: var(--anatomy-shade-0);
        stroke: none;
      }
      .tb-ring {
        fill: none;
        stroke: var(--anatomy-lo);
        stroke-width: 0.45;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }
      .tb-ring[data-tone="mid"] {
        stroke: var(--anatomy-mid);
      }
      .tb-ring[data-tone="faint"] {
        stroke: var(--anatomy-faint);
      }
      .tb-ring[data-tone="hi"] {
        stroke: var(--anatomy-hi);
      }
      @keyframes iso-flow {
        to {
          stroke-dashoffset: -32;
        }
      }
      @keyframes iso-pulse {
        0%,
        100% {
          opacity: 0.18;
        }
        12% {
          opacity: 1;
        }
        40% {
          opacity: 0.18;
        }
      }
      .iso-line[data-flow] {
        animation: iso-flow 1600ms linear infinite;
      }
      .iso-dots circle[data-pulse] {
        animation: iso-pulse 1600ms steps(1, end) infinite;
        animation-delay: var(--pulse-at, 0ms);
      }
      .iso-figure {
        margin: 32px 0 36px;
      }
      .iso-plate {
        position: relative;
        padding: 52px 24px;
        border-radius: 0;
        background: var(--anatomy-card);
        box-shadow: 0 0 0 1px var(--anatomy-mid);
        --anatomy-paper: var(--anatomy-card);
      }
      .iso-plate-corners {
        position: absolute;
        inset: 18px 20px;
        pointer-events: none;
      }
      .iso-plate-corner {
        position: absolute;
        color: var(--anatomy-muted);
        font-family: var(--anatomy-mono);
        font-size: 10.5px;
        line-height: 1;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .iso-plate-corner[data-corner="fig"] {
        top: 0;
        left: 0;
        color: var(--anatomy-text);
      }
      .iso-plate-corner[data-corner="title"] {
        top: 0;
        right: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .iso-plate-corner[data-corner="hint"] {
        bottom: 0;
        left: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .iso-plate-corner[data-corner="readout"] {
        right: 0;
        bottom: 0;
        color: var(--anatomy-text);
        font-variant-numeric: tabular-nums;
      }
      .iso-plate .iso-svg {
        margin: 0 auto;
      }
      .iso-legend {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        color: var(--anatomy-muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .iso-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
      }
      .iso-key {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .iso-swatch {
        width: 16px;
        height: 10px;
        flex: none;
        overflow: visible;
      }
      .iso-swatch path {
        fill: none;
        stroke: var(--anatomy-hi);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .iso-swatch[data-mark="raised"] path,
      .iso-swatch[data-mark="flat"] path {
        stroke: var(--anatomy-mid);
      }
      .iso-swatch[data-mark="lit"] path {
        stroke: var(--anatomy-lit);
      }
      .iso-swatch[data-mark="dim"] path {
        stroke: var(--anatomy-lo);
      }
      .iso-swatch[data-mark="dotted"] path {
        stroke-dasharray: 0.01 3;
        stroke-width: 1.4;
      }
      .iso-swatch[data-mark="dashed"] path {
        stroke-dasharray: 3 2.5;
      }
      .iso-swatch[data-mark="red"] path {
        stroke: var(--anatomy-red);
      }
      .iso-swatch[data-mark="green"] path {
        stroke: var(--anatomy-green);
      }
      .iso-swatch[data-mark="blue"] path {
        stroke: var(--anatomy-blue);
      }
      .iso-swatch-crease {
        stroke: var(--anatomy-lo) !important;
      }
      @media (max-width: 560px) {
        .iso-plate {
          padding: 48px 12px 70px;
        }
        .iso-plate-corner[data-corner="hint"] {
          bottom: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .iso-line[data-flow],
        .iso-dots circle[data-pulse] {
          animation: none;
        }
      }

      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body[data-theme="light"] {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: var(--anatomy-page);
        color: var(--anatomy-text);
        font:
          14px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .iso-page {
        width: min(760px, 100% - 32px);
        margin: 64px auto 96px;
      }
    </style>
  </head>

    <script type="module">
      const AZIMUTH = 45;
      const ELEVATION = 30;
      const SHADES = 4;
      const RADIANS = Math.PI / 180;
      const UNIT = Math.sqrt(1.6);
      function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
        const a = azimuth * RADIANS;
        const e = elevation * RADIANS;
        return {
          sinA: Math.sin(a),
          cosA: Math.cos(a),
          sinE: Math.sin(e),
          cosE: Math.cos(e),
          k: scale * UNIT,
        };
      }
      function iso([x, y, z], projection) {
        const { origin } = projection;
        const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
        return [
          origin[0] + (x * sinA - y * cosA) * k,
          origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k,
        ];
      }
      function towardViewer(projection) {
        const { sinA, cosA } = cameraOf(projection);
        return [cosA, sinA];
      }
      function depthOf([x, y, z], projection) {
        const { sinA, cosA, sinE, cosE } = cameraOf(projection);
        return (x * cosA + y * sinA) * cosE + z * sinE;
      }
      const tenth = (value) => {
        const text = (Math.round(value * 10) / 10)
          .toFixed(1)
          .replace(/\.0$/, "");
        return text === "-0" ? "0" : text;
      };
      function pathOf(points, closed = false) {
        if (!points.length) return "";
        return (
          points
            .map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`)
            .join("") + (closed ? "Z" : "")
        );
      }
      const joinPaths = (paths) => paths.filter(Boolean).join("");
      function roundedPlan({ x, y, w, d, r }, steps = 8) {
        const radius = Math.max(0, Math.min(r, w / 2, d / 2));
        const corners = [
          [x + w - radius, y + radius, -90],
          [x + w - radius, y + d - radius, 0],
          [x + radius, y + d - radius, 90],
          [x + radius, y + radius, 180],
        ];
        const out = [];
        for (const [cx, cy, start] of corners) {
          const count = radius > 0 ? steps : 0;
          for (let step = 0; step <= count; step++) {
            const angle =
              (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([
              cx + radius * Math.cos(angle),
              cy + radius * Math.sin(angle),
            ]);
          }
        }
        return out;
      }
      function signedArea(points) {

        let t = 3;
        let who = "them";

          t += 3.5 + rnd() * 6;

        return out;

      // tools are indexes into [list_sources, search_context, read_source, read_transcript, list_meetings].

        300: { tools: [0] },
        440: { kind: "loop", tools: [3], rows: [1, 0.78, 0.86, 0.6] },
        520: { kind: "stuck", tools: [] },
        700: { kind: "info", tools: [1, 2], rows: [0.92] },
        900: { kind: "loop", tools: [3], rows: [1, 0.7, 0.8] },
        1000: { tools: [3, 4] },
      };

      const countAt = (t) => {

        while (n < LINES.length && LINES[n].t <= t) n++;

      function timeline() {

        const emitted = [];
        let lastEmit = -1e9;

        let lastAttemptLines = null;

            else {
              outcome = "emit";
              lastEmit = t;
              emitted.push({ t, kind: v.kind, rows: v.rows || [0.9] });

            t,
            n,
            filing,
            filed: filedAt !== null,
            kind: v.kind || null,
            outcome,
            tools: v.tools || [],

      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const ease = (v) => v * v * (3 - 2 * v);

      const envelope = (dt, a, hold, d) =>
        dt < 0

          : dt < a
            ? ease(dt / a)
            : dt < a + hold

        const n = countAt(live);
        let tick = null;
        for (const k of T.ticks) if (k.t <= t) tick = k;

        for (const e of T.emitted)

              ? "ended · session summary"
              : t < M.END + 70

                : "summary filed with meeting";

          live,
          n,
          tick,
          tickNo: tick ? tick.t / M.TICK : 0,

          folder: T.filedAt === null ? 0 : ease(clamp01((t - T.filedAt) / 14)),

          rise: card ? ease(clamp01((t - card.t) / 5)) : 0,

            ? Math.exp(-Math.max(0, t - card.t) / 2.5) * (t >= card.t ? 1 : 0)

      // the build (Node) and, inlined, in the page.
      const C = {
        REELS: [
          [-170, 2],
          [170, 2],

        FLANGE_R: 32,
        PACK: [28, 12],
        PACK_K: 0.733,

        RUN: [-138, 138],

        PINS: 9,

        DIAL_A: [38, -33, 13, 14],
        DIAL_B: [72, -33, 10, 13],
        CARD: { x: 93.5, y: 6.6, w: 27, d: 1.2, z: 2, h: 28, box: 16 },
        RACK: { x: 40, y: -100, w: 104, d: 28, r: 2, h: 46, face: -72 },
        CUBBY: { x0: 44, w: 21, gap: 25, z0: 4, h: 17, row: 21 },
        FOLDER: {
          w: 16,
          d: 20,
          h: 1.4,
          from: [19, -86, 2.2],
          cubby: [1, 0],
          over: -62,
        },
        TRAY: { x: 152, y: -100, w: 50, d: 38, r: 2 },
      };

      const lerp = (a, b, f) => a + (b - a) * f;

      function tangentPoint(c, r, q, side) {
        const dx = q[0] - c[0];
        const dy = q[1] - c[1];
        const d = Math.hypot(dx, dy);
        const base = Math.atan2(dy, dx);
        const a = Math.acos(Math.min(1, r / d));
        const p1 = [
          c[0] + r * Math.cos(base + a),
          c[1] + r * Math.sin(base + a),
        ];
        const p2 = [
          c[0] + r * Math.cos(base - a),
          c[1] + r * Math.sin(base - a),
        ];
        return side > 0 ? (p1[0] > p2[0] ? p1 : p2) : p1[0] < p2[0] ? p1 : p2;
      }

      function packRadii(C, live, V) {
        const len = V * live;
        return {
          len,
          r: [
            Math.sqrt(C.PACK[0] ** 2 - C.PACK_K * len),
            Math.sqrt(C.PACK[1] ** 2 + C.PACK_K * len),
          ],
        };
      }

      // Wound tape on both reels, and the two runs from pack to roller.
      function packsSvg(K, P, C, R) {
        const { z0, z1 } = C.TAPE;
        const out = [];
        C.REELS.forEach(([x, y], i) =>
          out.push(
            K.solidSvg(K.cylinder(x, y, R.r[i], z0, z1 - z0, P, 64), {
              tone: "hi",
              crease: "lo",
            }),
          ),
        );
        C.REELS.forEach((c, i) => {
          const roller = C.ROLLERS[i];
          const q = [roller[0], C.TAPE.y0 + 0.4];
          const p = tangentPoint(c, R.r[i] - 0.2, q, i === 0 ? 1 : -1);
          const dx = q[0] - p[0];
          const dy = q[1] - p[1];
          const l = Math.hypot(dx, dy);
          const n = [(-dy / l) * 0.4, (dx / l) * 0.4];
          const ringPts = [
            [p[0] - n[0], p[1] - n[1]],
            [q[0] - n[0], q[1] - n[1]],
            [q[0] + n[0], q[1] + n[1]],
            [p[0] + n[0], p[1] + n[1]],
          ];
          out.push(
            K.solidSvg(K.extrude(ringPts, z0, z1 - z0, P), {
              tone: "hi",
              crease: "none",
            }),
          );
        });
        return out.join("");
      }

      // The three windows in each top flange, turning with the reel.
      function spokesSvg(K, P, C, R) {
        const out = [];
        C.REELS.forEach(([x, y], i) => {
          const turn =
            (i === 0 ? -1 : 1) * (R.len / ((C.PACK[0] + C.PACK[1]) / 2));
          for (let w = 0; w < 3; w++) {
            const a = turn + (w * Math.PI * 2) / 3;
            const pts = [];
            for (let s = 0; s <= 10; s++) {
              const t = a - 0.55 + (1.1 * s) / 10;
              pts.push([x + Math.cos(t) * 25, y + Math.sin(t) * 25]);
            }
            for (let s = 10; s >= 0; s--) {
              const t = a - 0.42 + (0.84 * s) / 10;
              pts.push([x + Math.cos(t) * 13.5, y + Math.sin(t) * 13.5]);
            }
            out.push(K.lineSvg(K.onTop(pts, 22.6, P, true), { tone: "mid" }));
          }
        });
        return out.join("");
      }

      // Transcript lines on the tape face: written at a head, carried right at V.
      function marksSvg(K, P, C, lines, live, V) {
        const inWin = [];
        const old = [];
        const face = C.TAPE.y1;
        for (const l of lines) {
          if (l.t > live) break;
          const x0 = C.HEADS[l.who] + 4 + V * (live - l.t);
          if (x0 > C.RUN[1] - 6) continue;
          const x1 = Math.min(x0 + l.len, C.RUN[1] - 6);
          const z = C.TRACK[l.who];
          const d = K.segment([x0, face, z], [x1, face, z], P);
          (x0 <= C.WINDOW[1] && x0 >= C.WINDOW[0] - 30 ? inWin : old).push(d);
        }
        return (
          K.lineSvg(old.join(""), { tone: "lo", free: true }) +
          K.lineSvg(inWin.join(""), { tone: "hi", free: true })
        );
      }

      // Four drawers pulled together on every tick: the prompt pastes all four.
      function drawersSvg(K, P, C, s) {
        const filled = [s.filed, s.filed, true, s.nudges > 0];
        const out = [];
        for (let i = 3; i >= 0; i--) {
          const z0 = C.DRAWER_Z[i];
          const pull = 6 * s.press;
          const front = C.CAB.y + C.CAB.d;
          out.push(
            K.solidSvg(
              K.slabOf(
                { x: -108, y: front, w: 50, d: 2.4 + pull, r: 1 },
                z0,
                C.DRAWER_H,
                P,
                3,
                0.4,
              ),
              { tone: "mid" },
            ),
          );
          if (filled[i] && pull > 2) {
            const h = 2.4 * Math.min(1, (pull - 2) / 3);
            out.push(
              K.solidSvg(
                K.slabOf(
                  { x: -100 + i * 4, y: front + 0.6, w: 16, d: 0.8, r: 0.2 },
                  z0 + C.DRAWER_H,
                  h,
                  P,
                  2,
                ),
                { tone: "hi", crease: "none" },
              ),
            );
          }
          const hy = front + 2.4 + pull;
          out.push(
            K.solidSvg(
              K.slabOf(
                { x: -87, y: hy, w: 8, d: 1.6, r: 0.8 },
                z0 + 4,
                2,
                P,
                3,
              ),
              { tone: "mid", crease: "none" },
            ),
          );
        }
        return out.join("");
      }

      function folderAt(C, f) {
        const F = C.FOLDER;
        const cub = C.CUBBY;
        const tx = cub.x0 + F.cubby[0] * cub.gap + cub.w / 2;
        const tz = cub.z0 + F.cubby[1] * cub.row + 1.6;
        const ty = C.RACK.face - 2 - F.d / 2;
        const [sx, sy, sz] = F.from;
        if (f < 0.3) {
          const g = f / 0.3;
          return [
            sx,
            lerp(sy, F.over, g),
            sz + 10 * Math.sin((g * Math.PI) / 2),
          ];
        }
        if (f < 0.65) {
          const g = (f - 0.3) / 0.35;
          return [lerp(sx, tx, g), F.over, lerp(sz + 10, tz + 3, g)];
        }
        const g = (f - 0.65) / 0.35;
        return [tx, lerp(F.over, ty, g), lerp(tz + 3, tz, Math.min(1, g * 2))];
      }

      // The meeting's folder: the part in front of the rack face plain, the part
      // inside clipped by the cubby opening.
      function folderSvg(K, P, C, f) {
        const F = C.FOLDER;
        const [cx, cy, z] = folderAt(C, f);
        const x = cx - F.w / 2;
        const y0 = cy - F.d / 2;
        const y1 = cy + F.d / 2;
        const face = C.RACK.face;
        const paint = (a, b) =>
          K.solidSvg(
            K.slabOf({ x, y: a, w: F.w, d: b - a, r: 0.6 }, z, F.h, P, 3),
            { tone: "hi" },
          );
        const tab = (a) =>
          K.solidSvg(
            K.slabOf(
              { x: x + 2, y: a - 1.6, w: 6, d: 1.6, r: 0.4 },
              z,
              F.h * 0.6,
              P,
              2,
            ),
            { tone: "hi", crease: "none" },
          );
        if (y0 >= face) return { inside: "", outside: tab(y0) + paint(y0, y1) };
        if (y1 <= face) return { inside: tab(y0) + paint(y0, y1), outside: "" };
        return { inside: tab(y0) + paint(y0, face), outside: paint(face, y1) };
      }

      const needle = (K, P, cx, cy, r, z, a) =>
        K.lineOnTop(
          [cx - Math.sin(a) * 2.6, cy + Math.cos(a) * 2.6],
          [cx + Math.sin(a) * r, cy - Math.cos(a) * r],
          z,
          P,
        );

      function needlesSvg(K, P, C, s) {
        const [ax, ay, ar, az] = C.DIAL_A;
        const [bx, by, br, bz] = C.DIAL_B;
        return (
          K.lineSvg(
            needle(
              K,
              P,
              ax,
              ay,
              ar - 4,
              az + 0.2,
              (s.cooldown / 180) * Math.PI * 2,
            ),
            { tone: "hi", free: "start" },
          ) +
          K.lineSvg(
            needle(
              K,
              P,
              bx,
              by,
              br - 3.4,
              bz + 0.2,
              (s.sameKind / 600) * Math.PI * 2,
            ),
            { tone: "hi", free: "start" },
          )
        );
      }

      // One intervention card, built at full height; the page slides it up.
      function cardSvg(K, P, C, card, KINDS) {
        const c = C.CARD;
        const plan = { x: c.x, y: c.y, w: c.w, d: c.d, r: 0.3 };
        let out = K.solidSvg(K.slabOf(plan, c.z, c.h, P, 2), {
          tone: "hi",
          lit: true,
        });
        const k = Math.max(0, KINDS.indexOf(card.kind));
        out += K.solidSvg(
          K.slabOf(
            { x: c.x + 1.5 + k * 6.4, y: c.y, w: 5, d: c.d, r: 0.4 },
            c.z + c.h,
            2.2,
            P,
            2,
          ),
          { tone: "hi", lit: true, crease: "none" },
        );
        const face = c.y + c.d;
        const rows = card.rows
          .map((w, j) =>
            K.segment(
              [c.x + 2.5, face, c.z + c.h - 3 - j * 2.8],
              [c.x + 2.5 + (c.w - 6) * w, face, c.z + c.h - 3 - j * 2.8],
              P,
            ),
          )
          .join("");
        return out + K.lineSvg(rows, { tone: "lit", free: true });
      }

      const P = {
        origin: [301.7776405937133, 200.39650534038068],
        scale: 1.0522674120497628,
        azimuth: 56,
        elevation: 34,
      };
      const PIN_X = [
        -93.33333333333333, -80, -66.66666666666666, -53.333333333333336, -40,
        -26.66666666666667, -13.333333333333329, 0, 13.333333333333329,
      ];
      const K = {
        slabOf,
        cylinder,
        extrude,
        solidSvg,
        lineSvg,
        segment,
        onTop,
        lineOnTop,
        iso,
        pathOf,
      };
      const TL = timeline();
      const stage = document.querySelector(".iso-stage");
      const svg = stage.querySelector("svg");
      const q = (s) => svg.querySelector('[data-part="' + s + '"]');
      const parts = {
        key: q("key"),
        packs: q("packs"),
        spokes: q("spokes"),
        marks: q("marks"),
        drawers: q("drawers"),
        needles: q("needles"),
        card: q("card"),
        plunger: q("plunger"),
        bell: q("bell"),
        fin: q("folder-in"),
        fout: q("folder-out"),
        s0: q("sheet0"),
        s1: q("sheet1"),
      };
      const pins = [...svg.querySelectorAll('[data-part="pin"]')];
      const rods = [...svg.querySelectorAll('[data-part="rod"]')];
      const readout = document.querySelector("[data-readout]");
      const still = matchMedia("(prefers-reduced-motion: reduce)");
      const SPAN = M.END + M.HOLD;
      const RATE = 15;
      let t = 0,
        target = 0,
        touring = true,
        visible = false,
        frame = 0,
        last = 0,
        idle = 0;
      let cardKey = null,
        folderKey = -1,
        drawerKey = "";
      function draw() {
        const s = stateAt(t, TL);
        const R = packRadii(C, s.live, M.V);
        parts.packs.innerHTML = packsSvg(K, P, C, R);
        parts.spokes.innerHTML = spokesSvg(K, P, C, R);
        parts.marks.innerHTML = marksSvg(K, P, C, LINES, s.live, M.V);
        const dk = s.press.toFixed(3) + s.filed + (s.nudges > 0);
        if (dk !== drawerKey) {
          drawerKey = dk;
          parts.drawers.innerHTML = drawersSvg(K, P, C, s);
        }
        parts.needles.innerHTML = needlesSvg(K, P, C, s);
        pins.forEach((p) =>
          p.setAttribute(
            "transform",
            translateAlong(P, [0, 0, -C.PIN_DROP * s.press]),
          ),
        );
        rods.forEach((r) =>
          r.setAttribute(
            "transform",
            translateAlong(P, [
              0,
              0,
              s.tools.includes(+r.dataset.i) ? 7 * s.press : 0,
            ]),
          ),
        );
        const fk = Math.round(s.folder * 400);
        if (fk !== folderKey) {
          folderKey = fk;
          const f = folderSvg(K, P, C, s.folder);
          parts.fin.innerHTML = f.inside;
          parts.fout.innerHTML = f.outside;
        }
        const key = s.card ? s.card.t : null;
        if (key !== cardKey) {
          cardKey = key;
          parts.card.innerHTML = s.card ? cardSvg(K, P, C, s.card, KINDS) : "";
        }
        parts.card.setAttribute(
          "transform",
          translateAlong(P, [0, 0, -14 + 14 * s.rise]),
        );
        parts.key.setAttribute(
          "transform",
          translateAlong(P, [
            0,
            0,
            -1.8 * Math.max(0, 1 - Math.abs(t - M.END) / 3),
          ]),
        );
        parts.plunger.setAttribute(
          "transform",
          translateAlong(P, [0, 0, -1.6 * s.strike]),
        );
        parts.bell.setAttribute(
          "transform",
          "translate(" + (0.35 * s.ring * Math.sin(t * 40)).toFixed(2) + " 0)",
        );
        parts.s0.setAttribute("opacity", s.sheets[0] > 0 ? 1 : 0);
        parts.s1.setAttribute("opacity", s.sheets[1] > 0 ? 1 : 0);
        parts.s0.setAttribute(
          "transform",
          translateAlong(P, [0, 0, 26 * (1 - s.sheets[0])]),
        );
        parts.s1.setAttribute(
          "transform",
          translateAlong(P, [0, 0, 26 * (1 - s.sheets[1])]),
        );
        if (readout.textContent !== s.readout) readout.textContent = s.readout;
        stage.setAttribute("aria-valuenow", String(Math.round(t)));
        stage.setAttribute("aria-valuetext", s.readout);
      }
      function tick(now) {
        const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
        last = now;
        if (touring) {
          target = (target + dt * RATE) % SPAN;
          t = target;
        } else
          t = still.matches
            ? target
            : t + (target - t) * (1 - Math.exp(-dt / 0.25));
        if (!touring && Math.abs(target - t) < 0.02) t = target;
        draw();
        const settled = !touring && t === target;
        frame = visible && !settled ? requestAnimationFrame(tick) : 0;
      }
      const run = () => {
        if (!frame && visible) {
          last = 0;
          frame = requestAnimationFrame(tick);
        }
      };
      const steer = (to) => {
        touring = false;
        target = Math.min(SPAN, Math.max(0, to));
        clearTimeout(idle);
        idle = setTimeout(() => {
          touring = !still.matches;
          run();
        }, 5000);
        run();
      };
      new IntersectionObserver(
        (e) => {
          visible = e[e.length - 1].isIntersecting;
          if (visible) run();
        },
        { rootMargin: "120px 0px" },
      ).observe(stage);
      if (still.matches) {
        touring = false;
        target = t = 445;
      }
      stage.addEventListener("pointermove", (ev) => {
        const box = svg.getBoundingClientRect();
        steer(
          Math.min(1, Math.max(0, (ev.clientX - box.left) / box.width)) * SPAN,
        );
      });
      stage.addEventListener("keydown", (ev) => {
        let to = null;
        if (ev.key === "ArrowRight" || ev.key === "ArrowUp")
          to = (Math.floor(target / M.TICK) + 1) * M.TICK + 0.5;
        if (ev.key === "ArrowLeft" || ev.key === "ArrowDown")
          to = (Math.ceil(target / M.TICK) - 1) * M.TICK + 0.5;
        if (ev.key === "Home") to = 0;
        if (ev.key === "End") to = M.END + 80;
        if (to === null) return;
        ev.preventDefault();
        steer(to);
      });
      const hash = Number(new URLSearchParams(location.search).get("t"));
      if (hash) {
        touring = false;
        target = t = hash;
      }
      draw();
    </script>
  </body>
</html>
