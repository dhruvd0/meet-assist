name: "Release"

# Publishes a GitHub Release with macOS (Apple Silicon, Intel) and Windows
# installers. Push a tag matching the version in tauri.conf.json (for example
# `git tag v0.9.8 && git push origin v0.9.8`), or run it by hand.
# Builds are unsigned: this fork has no Apple or Azure signing secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              name: `CASE v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
              body: [
                "## Download",
                "- **macOS (Apple Silicon):** `*_aarch64.dmg`",
                "- **macOS (Intel):** `*_x64.dmg`",
                "- **Windows:** `*_x64-setup.exe` (or `.msi`)",
                "",
                "These builds are not signed.",
                "- macOS: drag CASE into Applications. If macOS blocks first launch, click **Done**, open **System Settings → Privacy & Security**, scroll to **Security**, and click **Open Anyway** for CASE. Authenticate and click **Open**. The DMG includes these steps.",
                "- Windows: SmartScreen warns on first launch; choose **More info → Run anyway**.",
                "",
                "## Updates",
                "CASE checks for updates at startup and every six hours, and downloads them automatically. Choose **Restart to update** in the sidebar after ending your meeting. Manage automatic updates in **Settings → About**. Portable installations link to the matching installer instead.",
              ].join("\n"),
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon. macOS 26 for the Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "case"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  publish-release:
    permissions:
      contents: write
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        with:
          script: |
            const releaseId = Number('${{ needs.create-release.outputs.release-id }}');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            const { token } = await github.auth();
            const readAsset = async (name) => {
              const asset = assets.find(asset => asset.name === name && asset.state === 'uploaded');
              if (!asset) throw new Error(`Missing updater asset: ${name}`);
              const response = await fetch(asset.url, {
                headers: { Accept: 'application/octet-stream', Authorization: `Bearer ${token}` },
              });
              if (!response.ok) throw new Error(`Cannot read updater asset: ${name} (${response.status})`);
              return response.text();
            };
            const manifest = JSON.parse(await readAsset('latest.json'));
            const version = '${{ needs.create-release.outputs.version }}';
            if (manifest.version !== version) throw new Error('Updater manifest version mismatch');
            for (const target of ['darwin-aarch64', 'darwin-x86_64', 'windows-x86_64', 'windows-x86_64-nsis', 'windows-x86_64-msi']) {
              const entry = manifest.platforms?.[target];
              if (!entry?.signature) throw new Error(`Missing updater signature: ${target}`);
              // A draft's assets are served from an `untagged-...` path until it is
              // published, so match by file name and check the manifest's own URL.
              const prefix = `/releases/download/v${version}/`;
              const name = entry.url.includes(prefix) ? decodeURIComponent(entry.url.split(prefix)[1]) : null;
              const asset = assets.find(asset => asset.name === name && asset.state === 'uploaded');
              if (!asset) {
                throw new Error(`Missing or incorrect updater package: ${target}`);
              }
              if ((await readAsset(`${asset.name}.sig`)).trim() !== entry.signature.trim()) {
                throw new Error(`Updater signature does not match package: ${target}`);
              }
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
            })
